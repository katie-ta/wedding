    <path id="leaf" d="M30 30C28.4 26 28.4 22 30 19.5C31.6 22 31.6 26 30 30Z"/>
    <g id="flower">
      <g fill="#9DB5AA">
        <use href="#leaf" transform="rotate(22.5 30 30) translate(0 -12)"/>
        <use href="#leaf" transform="rotate(112.5 30 30) translate(0 -12)"/>
        <use href="#leaf" transform="rotate(202.5 30 30) translate(0 -12)"/>
        <use href="#leaf" transform="rotate(292.5 30 30) translate(0 -12)"/>
      </g>
      <g opacity="0.55">
        <use href="#petal" transform="rotate(45 30 30)"/>
        <use href="#petal" transform="rotate(135 30 30)"/>
        <use href="#petal" transform="rotate(225 30 30)"/>
        <use href="#petal" transform="rotate(315 30 30)"/>
      </g>
      <g opacity="0.92">
