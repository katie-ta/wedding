        <use href="#petal" transform="rotate(90 30 30)"/>
        <use href="#petal" transform="rotate(180 30 30)"/>
        <use href="#petal" transform="rotate(270 30 30)"/>
      </g>
      <circle cx="30" cy="30" r="3.4" fill="#F6F2EA"/>
      <circle cx="30" cy="30" r="1.7" fill="#B88A45"/>
    </g>
  </defs>
  <g transform="translate(60 0) rotate(90)">
  <rect width="240" height="60" fill="#F6F2EA"/>
  <use href="#flower" fill="#16346A"/>
  <use href="#flower" fill="#7B2E22" x="60"/>
  <use href="#flower" fill="#6E86A8" x="120"/>
  <use href="#flower" fill="#2A5A40" x="180"/>
  <g fill="#7B2E22" opacity="0.8"><circle cx="0" cy="0" r="2.6"/><circle cx="60" cy="0" r="2.6"/><circle cx="120" cy="0" r="2.6"/><circle cx="180" cy="0" r="2.6"/><circle cx="240" cy="0" r="2.6"/><circle cx="0" cy="60" r="2.6"/><circle cx="60" cy="60" r="2.6"/><circle cx="120" cy="60" r="2.6"/><circle cx="180" cy="60" r="2.6"/><circle cx="240" cy="60" r="2.6"/></g>
  <g fill="none" stroke="#16346A" stroke-width="0.8" opacity="0.7">
